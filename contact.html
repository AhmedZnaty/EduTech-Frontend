<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EduTech - Contact</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="navbar">
      <a href="index.html" class="logo"> Edu<span>Tech</span> </a>

      <nav class="nav-links">
        <a href="index.html">Home</a>

        <a href="courses.html">Courses</a>

        <a href="dashboard.html">Dashboard</a>

        <a href="contact.html" class="active">Contact</a>
      </nav>

      <div class="nav-buttons">
        <a href="login.html" class="btn-login"> Login </a>

        <a href="register.html" class="btn-primary"> Register </a>
      </div>
    </header>

    <section class="contact-section">
      <div class="contact-header">
        <span class="section-label"> Get In Touch </span>

        <h1>Contact <span>EduTech</span></h1>

        <p>
          Have a question or need help? Send us a message and our team will get
          back to you.
        </p>
      </div>

      <div class="contact-container">
        <div class="contact-info">
          <div class="contact-card">
            <div class="contact-icon">@</div>

            <div>
              <h3>Email</h3>

              <p>support@edutech.com</p>
            </div>
          </div>

          <div class="contact-card">
            <div class="contact-icon">☎</div>

            <div>
              <h3>Phone</h3>

              <p>+20 100 000 0000</p>
            </div>
          </div>

          <div class="contact-card">
            <div class="contact-icon">⌂</div>

            <div>
              <h3>Location</h3>

              <p>Cairo, Egypt</p>
            </div>
          </div>
        </div>

        <div class="contact-form-container">
          <form id="contactForm" class="contact-form">
            <div class="form-group">
              <label for="contactNameInput"> Name </label>

              <input
                type="text"
                id="contactNameInput"
                placeholder="Enter your name"
              />

              <small id="contactNameError"></small>
            </div>

            <div class="form-group">
              <label for="contactEmailInput"> Email </label>

              <input
                type="email"
                id="contactEmailInput"
                placeholder="Enter your email"
              />

              <small id="contactEmailError"></small>
            </div>

            <div class="form-group">
              <label for="contactMessageInput"> Message </label>

              <textarea
                id="contactMessageInput"
                placeholder="Write your message"
                rows="6"
              ></textarea>

              <small id="contactMessageError"></small>
            </div>

            <button type="submit" class="btn-primary contact-button">
              Send Message
            </button>

            <p id="contactMessage" class="form-message"></p>
          </form>
        </div>
      </div>
    </section>

    <script src="js/main.js"></script>
  </body>
</html>

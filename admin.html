<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EduTech - Admin</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="navbar">
      <a href="index.html" class="logo"> Edu<span>Tech</span> </a>

      <nav class="nav-links">
        <a href="index.html">Home</a>

        <a href="courses.html">Courses</a>

        <a href="dashboard.html">Dashboard</a>

        <a href="contact.html">Contact</a>
      </nav>

      <div class="nav-buttons">
        <a href="index.html" class="btn-login"> Back to Website </a>
      </div>
    </header>

    <section class="admin-section">
      <div class="container">
        <div class="admin-header">
          <span class="section-label"> Administration </span>

          <h1>Admin <span>Dashboard</span></h1>

          <p>Manage the courses available on EduTech.</p>
        </div>

        <div class="admin-layout">
          <div class="admin-form-container">
            <h2>Add / Edit Course</h2>

            <form id="courseForm" class="admin-form">
              <div class="form-group">
                <label for="courseNameInput"> Course Name </label>

                <input
                  type="text"
                  id="courseNameInput"
                  placeholder="Enter course name"
                />
              </div>

              <div class="form-group">
                <label for="courseCategoryInput"> Category </label>

                <input
                  type="text"
                  id="courseCategoryInput"
                  placeholder="Enter category"
                />
              </div>

              <div class="form-group">
                <label for="courseLevelInput"> Level </label>

                <select id="courseLevelInput">
                  <option value="Beginner">Beginner</option>

                  <option value="Intermediate">Intermediate</option>

                  <option value="Advanced">Advanced</option>
                </select>
              </div>

              <div class="form-group">
                <label for="courseDurationInput"> Duration </label>

                <input
                  type="text"
                  id="courseDurationInput"
                  placeholder="Example: 8 Weeks"
                />
              </div>

              <button type="submit" class="btn-primary">Save Course</button>
            </form>
          </div>

          <div class="admin-courses-container">
            <h2>Manage Courses</h2>

            <div id="adminCourseList" class="admin-course-list"></div>
          </div>
        </div>
      </div>
    </section>

    <script src="js/main.js"></script>
  </body>
</html>
